# Kotoha lefthook configuration
# Origin: ~/.claude/templates/lefthook.yml.template
# Guard model:
# - pre-commit fmt-check: uses lefthook-native glob ("*.rs") to skip when no .rs is staged.
# - pre-commit doc-naming: uses glob to skip when no doc files are staged.
# - pre-push build/clippy/test: use shell guard '[ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]'
#   because Cargo workspace commands cannot be skipped by lefthook glob alone (they need to inspect
#   the full workspace). Until the first crate is added in M2, these are intentional no-ops.

pre-commit:
  parallel: true
  commands:
    # シークレットスキャン (gitleaks): staged 差分の即時ブロック
    secrets-scan:
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose .
    fmt-check:
      glob: "*.rs"
      run: cargo fmt --all --check
    # doc-naming script は canonical (~/.claude/templates/scripts/pre-commit-doc-naming.sh) で上書き済。
    # script 内部で `git diff --cached --name-only --diff-filter=ACMR` で staged files を再取得するため
    # lefthook の glob は不要 (二重責務回避)。
    doc-naming:
      run: ./scripts/pre-commit-doc-naming.sh
    # pre-commit-doc-naming.sh の awk ロジック (特に mawk での exit code 挙動) が
    # サイレントに壊れていた経緯があるため、常時自己テストを走らせて再発を防ぐ。
    doc-naming-self-test:
      run: bash ./scripts/tests/test-doc-naming.sh

pre-push:
  parallel: false
  commands:
    # workspace に member crate が無い間 (M1 期間中) は Cargo 1.94+ がエラーで落ちるため
    # manifest の妥当性だけを検証し、build / clippy / test は crates/ ディレクトリが出現
    # してから有効化する。M2 (最初の member crate 追加) 以降は自動的に有効化される。
    manifest-check:
      run: cargo metadata --no-deps --format-version=1 > /dev/null
    build:
      run: |
        if [ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]; then
          cargo build --workspace
        else
          echo "lefthook: skip build (no crates/ yet; enforced from M2)"
        fi
    clippy:
      run: |
        if [ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]; then
          cargo clippy --workspace --all-targets -- -D warnings
        else
          echo "lefthook: skip clippy (no crates/ yet; enforced from M2)"
        fi
    test:
      # B0h-b (#155) で `kotoha-ranker-hybrid/test-helpers` を追加する。
      # `crates/kotoha-ranker-hybrid/tests/engine_wrap_hybrid.rs` は本 feature
      # gate (`#![cfg(feature = "test-helpers")]`) で gate されており、未指定の
      # ままだと test 関数が登録されない silent skip になる(self-review F2)。
      run: |
        if [ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]; then
          cargo test --workspace --features kotoha-storage/test-helpers,kotoha-ranker-hybrid/test-helpers
        else
          echo "lefthook: skip test (no crates/ yet; enforced from M2)"
        fi
    # `test` step は default features のみを実行する。`feature = "dict"` 配下の
    # hardening test (`custom_vocab::tests::*` / `sudachi_adapter::tests::*`) は
    # default では compile されないため、本 step を別に走らせて pre-push gate で
    # 保護する(P2-A hardening review Fix 4)。`mock-backend` は default の
    # `cargo test --workspace` でカバー済みなので含めない。
    # `dict-smoke` は SudachiDict-core file が必要なため pre-push では走らせない。
    test-dict:
      run: |
        if [ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]; then
          cargo test --workspace --features dict,kotoha-storage/test-helpers
        else
          echo "lefthook: skip test-dict (no crates/ yet; enforced from M2)"
        fi
    # P2-B (review A-H1 / T-H2): `dict-persist` feature 配下の Layer 2/3/4
    # storage / CLI integration test が pre-push で gate されていなかった。
    # `kotoha-cli/dict-persist` は `kotoha-core/dict-persist` を引き、
    # `kotoha-storage` の SQLite 経路と CLI smoke test (`tests/dict_cli.rs`) を
    # まとめて compile + run する。
    test-dict-persist:
      run: |
        if [ -d crates ] && [ -n "$(ls -A crates 2>/dev/null)" ]; then
          cargo test --workspace --features kotoha-cli/dict-persist,kotoha-storage/test-helpers
        else
          echo "lefthook: skip test-dict-persist (no crates/ yet; enforced from M2)"
        fi
    # Obsidian vault 同期検証: spec frontmatter 厳密 + glossary 突合 + symlink 解決 + adr-index 反映
    # OBSIDIAN_VAULT_DIR 未設定時は silent skip (exit 0)
    obsidian-sync:
      run: bash scripts/pre-push-obsidian-sync.sh
