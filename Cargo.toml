[workspace]
resolver = "2"
members = [
    "crates/kotoha-core",
    "crates/kotoha-cli",
    "crates/kotoha-storage",
    "crates/kotoha-engine-core",
    "crates/kotoha-engine-adapter",
    "crates/kotoha-ranker-hybrid",
    "crates/kotoha-engine-ibus",
    "crates/kotoha-bin",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/std-koh-hinooka/kotoha-ime"
authors = ["std-koh-hinooka <koh.hinooka@student.it.com>"]

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1.5"
clap = { version = "4.5", features = ["derive"] }
# llama-cpp-2 pinned via Q1 (P1-2-2 research, 2026-04-24).
# Adopted reason: latest stable (0.1.145, MIT OR Apache-2.0, active maintainer).
# Alternatives rejected per spec §3.1: llama_cpp-rs (stale 2y), mistral.rs (MSRV 1.88), Candle (orthogonal).
llama-cpp-2 = "0.1"
# sudachi.rs pinned via P2-A Q1 (brainstorming, 2026-04-25).
# Adopted reason: SudachiDict-core を native Rust で読込可能、P5-A PoC と辞書整合、Apache-2.0。
# Alternatives rejected per P2-A spec §3.1 Q1:
#   - lindera: MeCab-IPADIC / UniDic 要求(UniDic は商用利用制約)
#   - vibrato: SudachiDict native 非対応(short/middle/long unit 不可)
#   - SudachiDict→MeCab 変換: WorksApplications 公式提供なし、精度保証なし
# rev は v0.6.11 tag の full SHA-1。短縮 SHA は将来衝突リスクがあるため 40-char に固定する。
# rev を更新したら `SUDACHI_ENGINE_ID_LABEL`
# (`crates/kotoha-core/src/dict/sudachi_adapter.rs`) を同期せよ。
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f" }
# rusqlite pinned via P2-B spec §3.5 (brainstorming, 2026-04-25).
# Adopted reason: Sync API matches kotoha-core sync design, `bundled` feature
# vendors SQLite C library so distro SQLite version differences are bypassed.
# Alternatives rejected per ADR 0015 / spec §3.5:
#   - sqlx / tokio-rusqlite: async runtime forced into kotoha-core
#   - diesel: ORM is overspec for 4-CRUD operations
rusqlite = { version = "0.32", features = ["bundled"] }
# Test-only dev-deps for Layer 3 CLI integration (spec §10.3.1 / §10.6).
tempfile = "3"
assert_cmd = "2"
serial_test = "3"
# bitflags pinned via P3-A M1 (2026-05-02). KeyModifiers の bitflag 表現に使う。
# Adopted reason: defacto standard、no_std 対応、P3-A spec §4.1 で明示要請。
bitflags = "2.6"
# zbus pinned via P3-A M4 (2026-05-02). IBus 1.x D-Bus binding。
# Adopted reason: pure-Rust, no GTK dep, defacto std for D-Bus on Rust。
# Alternatives rejected: ibus-rs (gtk-rs based, heavy and stale),
# dbus-rs (sync C bindings, complex)。
# default features (= async-io + p2p + introspection) を使う。tokio runtime を
# 持ち込まない方針で async-io(smol-based)を選択し、blocking-api を併用して
# Phase 3-A M3 (std::sync) と同期 path を保つ。
zbus = "5"
# serde は zbus 5 が transitively 依存。P3-B B2 では `Value::Structure(...)` の
# 直接構築方式を採用し `#[derive(Serialize)]` は不要になったため、kotoha 各 crate
# は workspace dep として参照しない。将来 derive を再導入する場合は本 entry の
# 再有効化と関連 crate の `serde = { workspace = true }` 復活を行う。
# serde = { version = "1", features = ["derive"] }
