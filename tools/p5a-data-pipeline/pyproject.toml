[project]
name = "kotoha-p5a-data-pipeline"
version = "0.1.0"
description = "Phase 5 P5-A data pipeline PoC for Kotoha IME custom romaji-base model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kotoha IME contributors" },
]
keywords = ["kotoha", "ime", "japanese", "romaji", "nlp", "data-pipeline"]
dependencies = [
    "sudachipy>=0.6",
    "sudachidict-small>=20240409",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotoha_p5a"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sudachipy", "sudachipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
