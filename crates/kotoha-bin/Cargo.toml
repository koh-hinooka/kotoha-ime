[package]
name = "kotoha-bin"
description = "Kotoha IME entry binary (Phase 3-A spec §3.1)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kotoha"
path = "src/main.rs"

[features]
default = []
# `dev-stubs` は開発時のみ有効化する fallback ranker / host bridge を gate する
# feature。OFF(default)では `StubRanker` / `StubHostBridge` の struct + impl が
# compile されず、release binary に含まれない。`KOTOHA_ALLOW_STUB=1` env var も
# 本 feature OFF 時は常に効果無しとして扱う(spec §11)。
# B0h-e (ISSUE #149 / #159) で導入。
dev-stubs = []

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
kotoha-engine-core = { path = "../kotoha-engine-core" }
# `kotoha-engine-adapter`: B0h-a (#149 / #153) で導入。SQLite store を engine-core
# domain ports (`UserVocabLookup` / `LearningLookup` / `LearningRecorder`) に
# wrap する hexagonal adapter。
kotoha-engine-adapter = { path = "../kotoha-engine-adapter" }
# `kotoha-ranker-hybrid`: B0h-b (#149 / #155) で engine-core から切り出した
# concrete Ranker adapter (SudachiDict + UserVocab + LearningCache + LLM)。
kotoha-ranker-hybrid = { path = "../kotoha-ranker-hybrid" }
kotoha-engine-ibus = { path = "../kotoha-engine-ibus" }
# Phase 3-B B0h-f + B3 (ADR 0020):4-thread topology + EventReactor を提供。
kotoha-engine-reactor-linux = { path = "../kotoha-engine-reactor-linux" }
kotoha-storage = { path = "../kotoha-storage" }
kotoha-core = { path = "../kotoha-core" }
# Phase 3-B B0h-f + B3 (ADR 0020):engine-loop / dbus-listener thread 間の
# channel + shutdown signal で利用。
crossbeam-channel = { workspace = true }
# Phase 3-B B3 (ADR 0020):listener thread に session bus connection を渡すため。
zbus = { workspace = true }
# Phase 3-B B6-a (#197):SIGTERM/SIGINT 受信時に listener_shutdown.request() +
# reactor shutdown_tx send で 4-thread topology を clean shutdown する。
ctrlc = { workspace = true }
