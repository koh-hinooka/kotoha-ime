[package]
name = "kotoha-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kotoha: core library for a Japanese IME (conversion, input mode management)"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
# `llama-cpp-2` is optional so default features do not pull in the C++ library and
# its bindgen build step. Activated only when the `llama-cpp` feature is enabled.
llama-cpp-2 = { workspace = true, optional = true }
# `sudachi` is optional so default features do not pull in the git-sourced dep tree.
# Activated only when the `dict` feature is enabled (P2-A spec §7.1).
sudachi = { workspace = true, optional = true }
# `kotoha-storage` is optional so default features do not pull in rusqlite C dep.
# Activated only when the `dict-persist` feature is enabled (P2-B spec §4.3).
kotoha-storage = { path = "../kotoha-storage", optional = true }

[dev-dependencies]
proptest = { workspace = true }
serial_test = { workspace = true }

[features]
default = []
# `mock-backend` exposes the deterministic MockBackend to cross-crate integration tests.
# Cannot be reduced to `#[cfg(test)]` because downstream test files live in a separate
# crate (the `tests/` directory) and need the public surface.
mock-backend = []
# `llama-cpp` gates LlamaCppBackend. P1-2.5 adopts Gemma-2-2B-jpn-it as the
# Phase 1 default model (spec §3.2). Activating this feature pulls in
# llama.cpp via llama-cpp-2 (C++ build required).
llama-cpp = ["dep:llama-cpp-2"]
# `llama-cpp-smoke` is the opt-in gate for Layer 3 live-inference smoke tests.
# Kept separate from `llama-cpp` so that lefthook pre-push, which only runs
# default features, does not attempt to load a real GGUF model.
llama-cpp-smoke = ["llama-cpp"]
# `dict` gates DictionaryBackend (SudachiDict baseline, P2-A spec §3.1 Q1).
# default = [] を維持し ADR 0012 D5 整合。
dict = ["dep:sudachi"]
# `dict-smoke` is the opt-in gate for Layer 3 golden fixture (530 cases).
# Kept separate from `dict` so lefthook pre-push does not attempt to load SudachiDict-core.
dict-smoke = ["dict"]
# `dict-persist` gates UserVocab + SQLite-backed user dict (P2-B spec §4.3).
# transitively enables `dict` because UserVocab impl VocabularyLookup (P2-A trait).
dict-persist = ["dep:kotoha-storage", "dict"]
