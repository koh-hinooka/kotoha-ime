[package]
name = "kotoha-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kotoha: core library for a Japanese IME (conversion, input mode management)"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
# `llama-cpp-2` is optional so default features do not pull in the C++ library and
# its bindgen build step. Activated only when the `zenz` feature is enabled.
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
# `mock-backend` exposes the deterministic MockBackend to cross-crate integration tests.
# Cannot be reduced to `#[cfg(test)]` because downstream test files live in a separate
# crate (the `tests/` directory) and need the public surface.
mock-backend = []
# `zenz` gates ZenzBackend. P1-2 wires in llama-cpp-2 as the actual inference
# backend (previously an empty flag during the P1-1 skeleton). Activating this
# feature pulls in llama.cpp via llama-cpp-2 (C++ build required).
zenz = ["dep:llama-cpp-2"]
# `zenz-smoke` is the opt-in gate for Layer 3 live-inference smoke tests (added in P1-2).
# Kept separate from `zenz` so that lefthook pre-push, which only runs default features,
# does not attempt to load a real GGUF model.
zenz-smoke = ["zenz"]
