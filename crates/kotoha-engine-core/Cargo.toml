[package]
name = "kotoha-engine-core"
description = "Kotoha IME engine domain core (host-agnostic, Phase 3-A spec §3.1)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# 本 crate は domain core layer に属し、host / persistence / Ranker concrete
# adapter のいずれにも依存しない(spec §3.1)。
#
# - `tracing`: domain layer 内 graceful degradation(learning_writer 失敗時等)
#   の構造化 log 用。
# - `kotoha-core` の `dict` feature は不要だった(P3-A 旧 ranker/hybrid 専用)。
#   B0h-b (#149 / #155) で HybridRanker を別 crate へ切り出した時点で、
#   `kotoha-core` への dict feature 依存も撤去できる…はずだが、`kotoha-core::Candidate`
#   value object 自体が必要なため引き続き default features (= 空) で参照する。
# - `bitflags`: `KeyModifiers` の bitflag 表現(spec §4.1)。
thiserror = { workspace = true }
tracing = { workspace = true }
bitflags = { workspace = true }
kotoha-core = { path = "../kotoha-core" }

[dev-dependencies]
# Integration tests は `MockUserVocabStore` / `MockLearningCacheStore` を直接
# 構築し、`kotoha-engine-adapter` の wrapper helpers
# (`arc_mock_user_vocab` / `arc_mock_learning_cache`) で domain port
# (`Arc<dyn UserVocabLookup>` / `Arc<dyn LearningLookup>`) として注入する。
# adapter は dev-dep のみで、production code には混入しない。
kotoha-storage = { path = "../kotoha-storage" }
kotoha-engine-adapter = { path = "../kotoha-engine-adapter" }

[features]
default = []
# Mock backends / fixtures for cross-crate test injection. M2 以降で需要 surface。
test-helpers = []
