[package]
name = "kotoha-engine-core"
description = "Kotoha IME engine domain core (host-agnostic, Phase 3-A spec §3.1)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# M1 で skeleton 確定後、M2 で `HybridRanker` 本実装が surface した依存を追加:
# - `tracing`: backend 個別エラー(`UserVocab` / `LearningCache`)の `tracing::warn!`
#   と sink drop 時の `tracing::trace!` で利用(M1 で YAGNI 削除した依存を再導入)。
# - `kotoha-storage`: `UserVocabReader` / `LearningCacheReader` trait + `MockXxxStore`
#   を `HybridRanker` が DI で受けるため再導入(同じく M1 で YAGNI 削除した依存)。
# - `kotoha-core` の `dict` feature: `MorphologicalEngine` trait を pull する
#   (`HybridRanker` の sudachi backend port)。
thiserror = { workspace = true }
tracing = { workspace = true }
kotoha-core = { path = "../kotoha-core", features = ["dict"] }
kotoha-storage = { path = "../kotoha-storage" }

[dev-dependencies]
# Integration tests (`tests/hybrid_ranker_dict.rs`) は `MockUserVocabStore` /
# `MockLearningCacheStore` を直接構築して使う。両者は kotoha-storage の
# `default features` で公開されており、test-helpers feature は不要。
kotoha-storage = { path = "../kotoha-storage" }

[features]
default = []
# Mock backends / fixtures for cross-crate test injection. M2 以降で需要 surface。
test-helpers = []
# `mock-backend` は kotoha-core::kanji::MockBackend を pull する pass-through。
# M3 で `tests/hybrid_ranker_llm.rs` が `Arc<dyn KanjiBackend + Send + Sync>`
# 経由で MockBackend を `with_llm()` builder に注入するため必要。
mock-backend = ["kotoha-core/mock-backend"]
# `llama-cpp` は kotoha-core::kanji::llama_cpp::LlamaCppBackend を pull する
# pass-through。lefthook pre-push の default features では feature off のため、
# llama.cpp C++ build は走らない。
llama-cpp = ["kotoha-core/llama-cpp"]
# `llama-cpp-smoke` は Layer 3 live-inference smoke test の opt-in gate。
# `regression_phase1.rs` の `mod smoke` は本 feature 有効時のみ compile される。
llama-cpp-smoke = ["kotoha-core/llama-cpp-smoke"]
